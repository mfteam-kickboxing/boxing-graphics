<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Титры Бокс / Кикбоксинг</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent; /* Прозрачный фон для Larix */
            font-family: 'Arial', sans-serif;
            font-weight: bold;
            color: white;
            overflow: hidden;
            width: 1920px;
            height: 1080px;
        }
        /* Главный контейнер внизу экрана */
        .overlay-container {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 0px; /* Слияние плашек в единую полосу */
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border-radius: 6px;
            overflow: hidden;
        }
        /* Общие стили для всех плашек */
        .badge {
            padding: 18px 30px;
            font-size: 26px;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        /* Номер пары (серый центр) */
        .pair-num { 
            background: #222222; 
            min-width: 140px;
            color: #f0f0f0;
            border-bottom: 4px solid #444444;
        }
        /* Красный угол (левый) */
        .red-corner { 
            background: #b30000; 
            min-width: 320px; 
            text-align: right;
            border-bottom: 4px solid #ff3333;
        }
        /* Синий угол (правый) */
        .blue-corner { 
            background: #0044cc; 
            min-width: 320px; 
            text-align: left;
            border-bottom: 4px solid #3377ff;
        }
    </style>
</head>
<body>

    <div class="overlay-container">
        <div class="badge red-corner" id="red">Загрузка...</div>
        <div class="badge pair-num" id="pair">...</div>
        <div class="badge blue-corner" id="blue">Загрузка...</div>
    </div>

    <script>
        // ЗАМЕНИТЕ СТРОКУ НИЖЕ НА ВАШ ID:
        const SHEET_ID = '1qJN8IWmrtfL3mlH-_MIwmYLZk-yIR55lTOCkMckCOWU'; 
        const URL = `https://google.com{SHEET_ID}/gviz/tq?tqx=out:json`;

        function updateData() {
            fetch(URL)
                .then(res => res.text())
                .then(data => {
                    // Форматируем ответ от Google в чистый JSON
                    const json = JSON.parse(data.substr(47).slice(0, -2));
                    const row = json.table.rows[0].c; // Читаем вторую строку таблицы
                    
                    // Распределяем данные по плашкам на экране
                    document.getElementById('pair').innerText = row[0] ? row[0].v : '';
                    document.getElementById('red').innerText = row[1] ? row[1].v : '';
                    document.getElementById('blue').innerText = row[2] ? row[2].v : '';
                })
                .catch(err => console.error("Ошибка обновления данных:", err));
        }

        // Автоматическое обновление каждые 3 секунды
        setInterval(updateData, 3000);
        updateData();
    </script>
</body>
</html>
