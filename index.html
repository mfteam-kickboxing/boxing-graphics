<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Титры Бокс / Кикбоксинг</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent; /* Прозрачный фон для Larix */
            font-family: 'Arial', sans-serif;
            font-weight: bold;
            color: white;
            overflow: hidden;
            width: 1920px;
            height: 1080px;
        }
        /* Главный контейнер внизу экрана */
        .overlay-container {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 0px; /* Слияние плашек в единую полосу */
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border-radius: 6px;
            overflow: hidden;
        }
        /* Общие стили для всех плашек */
        .badge {
            padding: 18px 30px;
            font-size: 26px;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        /* Номер пары (серый центр) */
        .pair-num { 
            background: #222222; 
            min-width: 140px;
            color: #f0f0f0;
            border-bottom: 4px solid #444444;
        }
        /* Красный угол (левый) */
        .red-corner { 
            background: #b30000; 
            min-width: 320px; 
            text-align: right;
            border-bottom: 4px solid #ff3333;
        }
        /* Синий угол (правый) */
        .blue-corner { 
            background: #0044cc; 
            min-width: 320px; 
            text-align: left;
            border-bottom: 4px solid #3377ff;
        }
    </style>
</head>
<body>

    <div class="overlay-container">
        <div class="badge red-corner" id="red">Загрузка...</div>
        <div class="badge pair-num" id="pair">...</div>
        <div class="badge blue-corner" id="blue">Загрузка...</div>
    </div>

    <script>
        const SHEET_ID = '1qJN8lWmrtfL3mlH_MiwmYLZk-ylR55lTOcKMcKCOWU'; 
        // ВНИМАНИЕ: Здесь теперь прописан точный рабочий адрес ://google.com
        const URL = `https://://google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;

        function updateData() {
            fetch(URL)
                .then(res => res.text())
                .then(csvText => {
                    const lines = csvText.split('\n');
                    if (lines.length > 1) {
                        // Читаем вторую строку (индекс 1)
                        const dataRow = lines[1].split(',');
                        
                        // Извлекаем чистые данные и убираем лишние кавычки
                        const pair = dataRow[0] ? dataRow[0].replace(/"/g, '').trim() : '';
                        const red = dataRow[1] ? dataRow[1].replace(/"/g, '').trim() : '';
                        const blue = dataRow[2] ? dataRow[2].replace(/"/g, '').trim() : '';

                        document.getElementById('pair').innerText = pair;
                        document.getElementById('red').innerText = red;
                        document.getElementById('blue').innerText = blue;
                    }
                })
                .catch(err => {
                    console.error("Ошибка чтения таблицы:", err);
                    document.getElementById('pair').innerText = "ОШИБКА URL";
                });
        }

        // Автоматическое обновление данных каждые 3 секунды
        setInterval(updateData, 3000);
        updateData();
    </script>
</body>
</html>
