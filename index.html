<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Титры Бокс / Кикбоксинг LIVE</title>
    <!-- Подключение официального Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; background: transparent;
            font-family: 'Impact', 'Arial Black', sans-serif; font-weight: normal; color: white;
            overflow: hidden; width: 100vw; height: 100vh; position: relative; box-sizing: border-box;
        }
        .graphics-wrapper {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%); 
            display: flex; flex-direction: column; align-items: center; width: 95%; max-width: 1200px;
        }
        .tournament-bar {
            background: rgba(17, 17, 17, 0.95); width: 100%; text-align: center;
            padding: 6px 0; font-size: 16px; color: #dddddd; text-transform: uppercase; letter-spacing: 3px;
            border-bottom: 2px solid #252525; box-shadow: 0 -5px 20px rgba(0,0,0,0.6);
            border-top-left-radius: 8px; border-top-right-radius: 8px; box-sizing: border-box;
        }
        .center-block { display: flex; flex-direction: column; align-items: center; position: relative; }
        .round-bar {
            background: #000000; color: #ffffff; font-size: 20px; padding: 3px 20px; letter-spacing: 2px;
            border-top-left-radius: 5px; border-top-right-radius: 5px; border: 2px solid #252525; border-bottom: none;
            min-width: 90px; text-align: center; margin-bottom: -1px; z-index: 10;
        }
        .main-bar { 
            display: flex; width: 100%; align-items: flex-end; background: #1a1a1a; 
            border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9); box-sizing: border-box;
        }
        .badge { text-transform: uppercase; text-align: center; white-space: nowrap; font-size: 32px; letter-spacing: 1px; height: 60px; display: flex; align-items: center; box-sizing: border-box; }
        .pair-num { 
            background: linear-gradient(to bottom, #ffffff, #e1e1e1); color: #000000; min-width: 130px; font-size: 26px; justify-content: center; z-index: 5; 
            border-left: 2px solid rgba(0,0,0,0.3); border-right: 2px solid rgba(0,0,0,0.3);
        }
        .red-corner { background: linear-gradient(to left, #7a0000, #cc0000); flex: 1; justify-content: flex-end; padding-right: 20px; gap: 12px; }
        .blue-corner { background: linear-gradient(to right, #002a99, #0044cc); flex: 1; justify-content: flex-start; padding-left: 20px; gap: 12px; }
        .club-logo { width: 42px; height: 42px; object-fit: contain; border-radius: 50%; }
    </style>
</head>
<body onload="startLiveLogic()">

    <div class="graphics-wrapper">
        <div class="tournament-bar" id="tournament">ТУРНИР</div>
        <div class="main-bar">
            <div class="badge red-corner">
                <span id="red">БОЕЦ КРАСНЫЙ</span>
                <img src="" class="club-logo" id="red-logo" style="display:none;">
            </div>
            <div class="center-block">
                <div class="round-bar" id="round">РАУНД 1</div>
                <div class="badge pair-num" id="pair">ПАРА №1</div>
            </div>
            <div class="badge blue-corner">
                <img src="" class="club-logo" id="blue-logo" style="display:none;">
                <span id="blue">БОЕЦ СИНИЙ</span>
            </div>
        </div>
    </div>

    <script>
        let localFights = []; 

        function startLiveLogic() {
            // Скачиваем ваш постоянный список пар из data.json
            fetch(`data.json?v=${Date.now()}`)
                .then(res => res.json())
                .then(jsonData => {
                    if (jsonData && jsonData.fights) { localFights = jsonData.fights; }
                    initFirebaseListener();
                })
                .catch(err => {
                    console.error("Ошибка чтения data.json:", err);
                    initFirebaseListener();
                });
        }

        function initFirebaseListener() {
            // Инициализация с подключением к вашей Realtime Database
            firebase.initializeApp({ databaseURL: 'https://mfteam-default-rtdb.firebaseio.com' });
            const db = firebase.database().ref('live_graphics_control');

            db.on('value', (snapshot) => {
                const control = snapshot.val();
                if (control) {
                    if(control.tournament_title) document.getElementById('tournament').innerText = control.tournament_title;
                    if(control.round_num) document.getElementById('round').innerText = control.round_num;
                    
                    const index = control.current_index || 0;
                    
                    if (localFights && localFights[index]) {
                        document.getElementById('pair').innerText = localFights[index].pair_num || `ПАРА №${index + 1}`;
                        document.getElementById('red').innerText = localFights[index].red_name || '...';
                        document.getElementById('blue').innerText = localFights[index].blue_name || '...';
                    }
                    
                    const redLogo = document.getElementById('red-logo');
                    const blueLogo = document.getElementById('blue-logo');
                    if (control.logo_url && control.logo_url.trim() !== "" && control.logo_url.indexOf('freeimage.host') === -1) {
                        redLogo.src = control.logo_url; redLogo.style.display = "block";
                        blueLogo.src = control.logo_url; blueLogo.style.display = "block";
                    } else {
                        redLogo.style.display = "none"; blueLogo.style.display = "none";
                    }
                }
            });
        }
    </script>
</body>
</html>
