<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Титры MFteam</title>
    <style>
        body {
            margin: 0; padding: 0; background: transparent;
            font-family: 'Arial', sans-serif; font-weight: bold; color: white;
            overflow: hidden; width: 1920px; height: 1080px;
        }
        /* Главный контейнер внизу экрана */
        .overlay-container {
            position: absolute; bottom: 60px; left: 50%;
            transform: translateX(-50%); display: flex; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); border-radius: 6px; overflow: hidden;
        }
        /* Общие стили для всех плашек */
        .badge { padding: 18px 30px; font-size: 26px; text-transform: uppercase; text-align: center; white-space: nowrap; }
        /* Номер пары (серый центр) */
        .pair-num { background: #222222; min-width: 140px; color: #f0f0f0; border-bottom: 4px solid #444444; }
        /* Красный угол (левый) */
        .red-corner { background: #b30000; min-width: 320px; text-align: right; border-bottom: 4px solid #ff3333; }
        /* Синий угол (правый) */
        .blue-corner { background: #0044cc; min-width: 320px; text-align: left; border-bottom: 4px solid #3377ff; }
    </style>
</head>
<body>

    <div class="overlay-container">
        <div class="badge red-corner" id="red">Загрузка...</div>
        <div class="badge pair-num" id="pair">...</div>
        <div class="badge blue-corner" id="blue">Загрузка...</div>
    </div>

    <script>
        // Скрипт запрашивает данные из data.json. v= исключает зависание кэша в Larix
        function updateData() {
            fetch(`data.json?v=${Date.now()}`)
                .then(res => {
                    if (!res.ok) throw new Error();
                    return res.json();
                })
                .then(data => {
                    // Заполняем плашки данными, которые вы ввели в панели CloudCannon
                    document.getElementById('pair').innerText = data.pair_num || '';
                    document.getElementById('red').innerText = data.red_name || '';
                    document.getElementById('blue').innerText = data.blue_name || '';
                })
                .catch(err => {
                    console.error("Ошибка обновления данных:", err);
                    document.getElementById('pair').innerText = "ОШИБКА";
                });
        }

        // Обновление экрана каждые 3 секунды
        setInterval(updateData, 3000);
        updateData();
    </script>
</body>
</html>
