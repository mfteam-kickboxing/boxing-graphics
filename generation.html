<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Генератор состава пар</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 15px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 15px; border: 1px solid #2d2d2d; }
        h2 { margin-top: 0; font-size: 18px; color: #ffd700; text-transform: uppercase; letter-spacing: 1px; }
        textarea { width: 100%; padding: 12px; background: #2d2d2d; border: 1px solid #444; border-radius: 6px; color: white; font-size: 16px; margin-bottom: 15px; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; background: #007a33; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 15px; }
        .btn:active { background: #005c25; }
        .output-box { background: #111; border: 1px dashed #555; padding: 15px; color: #00ff66; font-family: monospace; white-space: pre-wrap; word-break: break-all; border-radius: 6px; font-size: 13px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Генератор списка пар (из Word)</h2>
        <div style="font-size:14px; color:#888; margin-bottom:10px;">Вставьте список (Формат: Боец 1 - Боец 2):</div>
        <textarea id="raw_list" rows="10" placeholder="Иванов Иван - Петров Петр&#10;Алиев Марат - Сидоров Олег" oninput="buildJSON()"></textarea>
        
        <button class="btn" onclick="copyJSON()">Скопировать готовый JSON</button>
        
        <div style="font-weight:bold; color:#ffd700; margin-bottom:5px;">Результат для data.json на GitHub:</div>
        <div class="output-box" id="json_output"></div>
    </div>

    <script>
        function buildJSON() {
            const text = document.getElementById('raw_list').value;
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            const parsedFights = [];

            lines.forEach((line, i) => {
                let parts = line.split(/\s*-\s*|\s+vs\s+/i);
                parsedFights.push({
                    pair_num: `ПАРА №${i + 1}`,
                    red_name: parts[0] ? parts[0].trim() : '...',
                    blue_name: parts[1] ? parts[1].trim() : '...'
                });
            });

            if(parsedFights.length === 0) {
                parsedFights.push({ pair_num: "ПАРА №1", red_name: "БОЕЦ КРАСНЫЙ", blue_name: "БОЕЦ СИНИЙ" });
            }

            const dataConfig = { fights: parsedFights };
            document.getElementById('json_output').innerText = JSON.stringify(dataConfig, null, 2);
        }

        function copyJSON() {
            const jsonText = document.getElementById('json_output').innerText;
            navigator.clipboard.writeText(jsonText).then(() => {
                alert('JSON успешно скопирован в буфер обмена!');
            }).catch(err => {
                console.error('Ошибка при копировании:', err);
                alert('Не удалось скопировать автоматически. Выделите текст в зеленой рамке вручную.');
            });
        }

        buildJSON();
    </script>
</body>
</html>
