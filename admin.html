<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Пульт эфира LIVE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Подключение официального Firebase SDK со скриншота -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 15px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 15px; border: 1px solid #2d2d2d; max-width: 500px; margin-left: auto; margin-right: auto; }
        h2 { margin-top: 0; font-size: 20px; color: #ffd700; text-transform: uppercase; letter-spacing: 1px; text-align: center; margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #aaa; }
        input { width: 100%; padding: 12px; background: #2d2d2d; border: 1px solid #444; border-radius: 6px; color: white; font-size: 16px; margin-bottom: 15px; box-sizing: border-box; }
        .btn-trigger { display: inline-block; width: 100%; padding: 16px; background: #ffd700; color: black; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 10px rgba(255,215,0,0.3); }
        .btn-trigger:active { background: #cca100; }
        .status { text-align: center; font-weight: bold; color: #00ff66; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body onload="initAdminPanel()">

    <div class="card">
        <h2>ПУЛЬТ ЭФИРА LIVE</h2>
        
        <label>Название турнира</label>
        <input type="text" id="tournament_title" value="Открытый ринг Moscow fight team">
        
        <label>Раунд / Статус</label>
        <input type="text" id="round_num" value="РАУНД 1">

        <label>Номер пары</label>
        <input type="text" id="pair_num" value="ПАРА №1">

        <label>Красный угол (Слева)</label>
        <input type="text" id="red_name" value="БОЕЦ КРАСНЫЙ">

        <label>Синий угол (Справа)</label>
        <input type="text" id="blue_name" value="БОЕЦ СИНИЙ">
        
        <label>Ссылка на Логотип (Если нужно)</label>
        <input type="text" id="logo_url" value="https://mfteam.ru">

        <button class="btn-trigger" onclick="updateLiveGraphics()">ОБНОВИТЬ ТИТРЫ</button>
        <div class="status" id="status_text"></div>
    </div>

    <script>
        let db = null;

        function initAdminPanel() {
            // Подключение к вашей личной базе Realtime Database
            firebase.initializeApp({ databaseURL: 'https://firebaseio.com' });
            db = firebase.database().ref('live_graphics_panel');

            // Подгружаем последние сохраненные в базе данные в поля пульта
            db.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    if (data.tournament_title) document.getElementById('tournament_title').value = data.tournament_title;
                    if (data.round_num) document.getElementById('round_num').value = data.round_num;
                    if (data.pair_num) document.getElementById('pair_num').value = data.pair_num;
                    if (data.red_name) document.getElementById('red_name').value = data.red_name;
                    if (data.blue_name) document.getElementById('blue_name').value = data.blue_name;
                    if (data.logo_url) document.getElementById('logo_url').value = data.logo_url;
                }
            });
        }

        function updateLiveGraphics() {
            if(!db) return;
            db.update({
                tournament_title: document.getElementById('tournament_title').value,
                round_num: document.getElementById('round_num').value,
                pair_num: document.getElementById('pair_num').value,
                red_name: document.getElementById('red_name').value,
                blue_name: document.getElementById('blue_name').value,
                logo_url: document.getElementById('logo_url').value
            });
            
            const status = document.getElementById('status_text');
            status.innerText = "ТИТРЫ ОБНОВЛЕНЫ НА СТРИМЕ!";
            setTimeout(() => status.innerText = "", 2000);
        }
    </script>
</body>
</html>
