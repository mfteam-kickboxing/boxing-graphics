<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Пульт управления LIVE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 15px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 15px; border: 1px solid #2d2d2d; }
        h2 { margin-top: 0; font-size: 18px; color: #ffd700; text-transform: uppercase; letter-spacing: 1px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; color: #aaa; }
        input { width: 100%; padding: 12px; background: #2d2d2d; border: 1px solid #444; border-radius: 6px; color: white; font-size: 16px; margin-bottom: 15px; box-sizing: border-box; }
        .btn { display: inline-block; width: 100%; padding: 14px; background: #0044cc; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 10px; width: 100%; }
        .btn:active { background: #0033aa; }
        .btn-success { background: #007a33; }
        .row { display: flex; gap: 10px; margin-bottom: 15px; }
        .row .btn { flex: 1; margin-bottom: 0; }
    </style>
</head>
<body>

    <div class="card">
        <h2>1. Настройки Турнира</h2>
        <label>Название турнира</label>
        <input type="text" id="tournament_title" value="ОТКРЫТЫЙ РИНГ MOSCOW FIGHT TEAM" oninput="pushLiveControl()">
        
        <label>Ссылка на Логотип (URL)</label>
        <input type="text" id="logo_url" value="https://freeimage.host" oninput="pushLiveControl()">
        <button class="btn btn-success" onclick="pushLiveControl()">Обновить настройки</button>
    </div>

    <div class="card" style="border-color: #ffd700;">
        <h2>2. Управление Эфиром LIVE</h2>
        <div style="text-align:center; margin: 15px 0; font-size:18px; background:#222; padding:15px; border-radius:6px;">
            В ЭФИРЕ СЕЙЧАС: <br><span id="current_info" style="color:#ffd700; font-weight:bold;">Подключение к базе...</span>
        </div>

        <div class="row">
            <button class="btn" onclick="changeFight(-1)">◀ Пред. пара</button>
            <button class="btn" onclick="changeFight(1)">След. пара ▶</button>
        </div>

        <label style="margin-top:10px;">Переключение раундов:</label>
        <div class="row">
            <button class="btn" style="background:#444;" onclick="setRoundLive('РАУНД 1')">Р1</button>
            <button class="btn" style="background:#444;" onclick="setRoundLive('РАУНД 2')">Р2</button>
            <button class="btn" style="background:#444;" onclick="setRoundLive('РАУНД 3')">Р3</button>
            <button class="btn" style="background:#8b0000;" onclick="setRoundLive('ПЕРЕРЫВ')">ПЕРЕРЫВ</button>
        </div>
    </div>

    <script>
        let db = null;
        let currentIndex = 0;
        let currentRound = "РАУНД 1";

        function initFirebaseLive() {
            firebase.initializeApp({ databaseURL: 'https://firebaseio.com' });
            db = firebase.database().ref('live_graphics_control');

            db.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    currentIndex = data.current_index || 0;
                    currentRound = data.round_num || "РАУНД 1";
                    document.getElementById('tournament_title').value = data.tournament_title || '';
                    document.getElementById('logo_url').value = data.logo_url || '';
                    document.getElementById('current_info').innerHTML = `ПАРА №${currentIndex + 1}<br><span style="color:#fff; font-size:14px;">${currentRound}</span>`;
                } else {
                    document.getElementById('current_info').innerText = "База пуста. Нажмите кнопку выше.";
                }
            });
        }

        function pushLiveControl() {
            if(!db) return;
            db.update({
                tournament_title: document.getElementById('tournament_title').value,
                logo_url: document.getElementById('logo_url').value,
                current_index: currentIndex,
                round_num: currentRound
            });
        }

        function changeFight(dir) {
            let newIdx = currentIndex + dir;
            if (newIdx >= 0) {
                currentIndex = newIdx;
                currentRound = "РАУНД 1";
                pushLiveControl();
            }
        }

        function setRoundLive(rName) {
            currentRound = rName;
            pushLiveControl();
        }

        // Динамический запуск библиотек cdnjs в обход блокировок чата
        const adm1 = document.createElement('script');
        adm1.src = 'https' + '://' + '://cloudflare.com';
        adm1.onload = () => {
            const adm2 = document.createElement('script');
            adm2.src = 'https' + '://' + '://cloudflare.com';
            adm2.onload = initFirebaseLive;
            document.head.appendChild(adm2);
        };
        document.head.appendChild(adm1);
    </script>
</body>
</html>
